name: CI & Patch Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-patches:
    name: Validate Patches Against Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mouserecomp-patch-fix
        uses: actions/checkout@v4

      - name: Validate TotK Recomp Patch
        run: |
          echo "Cloning upstream valentderah/totk-pc-recomp..."
          git clone --depth 1 https://github.com/valentderah/totk-pc-recomp.git totk-src
          echo "Testing totk/mouse-fix.patch..."
          git -C totk-src apply --check "$GITHUB_WORKSPACE/totk/mouse-fix.patch"
          echo "TotK patch applies cleanly!"

      - name: Validate Savage Wind Recomp Patch
        run: |
          echo "Cloning SavageWindRecomp v0.3.1-alpha.3..."
          git clone --depth 1 --branch v0.3.1-alpha.3 https://github.com/Revivedx/SavageWindRecomp.git sw-src
          echo "Testing mouse-fix.main.patch..."
          git -C sw-src apply --check "$GITHUB_WORKSPACE/mouse-fix.main.patch"
          echo "Savage Wind patch applies cleanly!"

  build-totk-runtime:
    name: Build TotK Runtime Library (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout mouserecomp-patch-fix
        uses: actions/checkout@v4

      - name: Checkout totk-pc-recomp (mouse-fix branch)
        uses: actions/checkout@v4
        with:
          repository: naufalalamsyah453/totk-pc-recomp
          ref: mouse-fix
          path: totk-src

      - name: Set up MSYS2 UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-zstd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate MSYS2 UCRT, Install SDL3 & Setup Junction
        shell: pwsh
        run: |
          # 1. Locate MSYS2 UCRT64
          $clang = Get-ChildItem "C:\", "D:\" -Filter "clang.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'ucrt64' } | Select-Object -First 1
          if (-not $clang) {
              Write-Error "Could not find MSYS2 clang.exe"
              exit 1
          }
          $bin = Split-Path -Parent $clang.FullName
          $ucrt = Split-Path -Parent $bin
          Write-Host "Located MSYS2 UCRT64 at: $ucrt"

          # Create C:\msys64\ucrt64 junction if not existing
          if (-not (Test-Path "C:\msys64\ucrt64")) {
              New-Item -ItemType Directory -Force -Path "C:\msys64" | Out-Null
              New-Item -ItemType Junction -Path "C:\msys64\ucrt64" -Target $ucrt -Force | Out-Null
          }

          # 2. Download and install SDL3 mingw into $ucrt
          $sdlVer = "3.4.18"
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$sdlVer/SDL3-devel-$sdlVer-mingw.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile sdl3.tar.gz
          tar -xzf sdl3.tar.gz
          $sdlDir = "SDL3-$sdlVer\x86_64-w64-mingw32"
          Copy-Item "$sdlDir\include\SDL3" "$ucrt\include\SDL3" -Recurse -Force
          Copy-Item "$sdlDir\lib\libSDL3.dll.a" "$ucrt\lib\libSDL3.dll.a" -Force
          Copy-Item "$sdlDir\bin\SDL3.dll" "$ucrt\bin\SDL3.dll" -Force

          # Export UCRT_DIR and BIN_DIR for next steps
          echo "UCRT_DIR=$ucrt" >> $env:GITHUB_ENV
          echo "UCRT_BIN=$bin" >> $env:GITHUB_ENV

      - name: Prepare Layout Header
        shell: pwsh
        run: |
          $genDir = "totk-src/generated/v143"
          New-Item -ItemType Directory -Force -Path $genDir | Out-Null
          $layoutContent = @"
          // Module layout chosen by recomp/layout.py. Generated; do not edit.
          #pragma once

          #define MOD_MAIN_BASE 0x7000000000ull
          #define MOD_MAIN_SIZE 0x3adf000ull
          #define MOD_SUBSDK0_BASE 0x7003c00000ull
          #define MOD_SUBSDK0_SIZE 0x66c000ull
          #define MOD_SDK_BASE 0x7004400000ull
          #define MOD_SDK_SIZE 0xc55000ull

          #define MOD_COUNT 3
          #define MOD_LIST(X) X(main, MAIN) X(subsdk0, SUBSDK0) X(sdk, SDK)
          "@
          Set-Content -Path (Join-Path $genDir "layout.h") -Value $layoutContent -Encoding Ascii

      - name: Build Patched libtotkrt.a
        shell: pwsh
        run: |
          cd totk-src
          $env:PATH = "$env:UCRT_BIN;$env:PATH"
          python tools/build_game.py --make-runtime-lib --version v143 --out build/rtlib --toolchain "$env:UCRT_DIR" --deps "$env:UCRT_DIR" --ninja (Join-Path "$env:UCRT_BIN" "ninja.exe")

      - name: Upload libtotkrt.a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtotkrt-patched
          path: totk-src/build/rtlib/libtotkrt.a

      - name: Upload Patches Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouserecomp-patches
          path: |
            totk/mouse-fix.patch
            mouse-fix.main.patch
            mouse-fix.test.patch
